version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dermaire_postgres
    restart: always
    environment:
      POSTGRES_USER: dermaire_user
      POSTGRES_PASSWORD: dermaire_secure_password_2027
      POSTGRES_DB: dermaire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermaire_user -d dermaire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dermaire_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dermaire_user:dermaire_secure_password_2027@db:5432/dermaire_db
      - ENVIRONMENT=production
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
